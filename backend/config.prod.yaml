# Production configuration.
# Use with: CODEZONE_CONFIG=config.prod.yaml ./api
#
# All REPLACE_ME values MUST be injected by the deployment pipeline / secret
# manager. Never commit real credentials to this file.

port: "8080"
mysql_dsn: "chat:REPLACE_ME@tcp(mysql-prod.internal:3306)/chat?parseTime=true&multiStatements=true"
session_secret: "REPLACE_ME_PROD_SESSION_SECRET"
cors_origin: "https://codezone.example.com"
dev_seed: false
enable_dev_login: false
oss:
  end_point: "REPLACE_ME"
  access_key_ID: "REPLACE_ME"
  access_key_secret: "REPLACE_ME"
  bucket_name: "REPLACE_ME"
  oss_url: "https://REPLACE_ME"
  path_prefix: "prod/codezone"
